name: bide_et_musique
description: Écouter et consulter la web radio 'Bide et Musique'

version: 4.2.0+62

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.0
  audio_service_mpris: ^0.2.1
  cached_network_image_ce: ^4.10.0
  diacritic: ^0.1.0
  flutter_html: ^3.0.0
  html: ^0.15.0
  http: ^1.6.0
  just_audio: ^0.10.4
  just_audio_media_kit: ^2.1.0
  package_info_plus: ^10.2.1
  page_indicator_plus: ^1.0.4
  share_plus: ^13.3.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.1.5
  xml: ^7.0.1
  wakelock_plus: ^1.7.0
  rxdart: ^0.28.0
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  test: ^1.30.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: false
  ios: true
  image_path: "assets/bm_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/lets-encrypt-r3.pem
    - assets/bandeau.png
    - assets/bm_logo_white.png
    - assets/vinyl-default.jpg
    - android/app/src/main/res/mipmap-mdpi/ic_launcher.png